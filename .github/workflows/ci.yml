name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: orchestrator
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: ai_orchestrator_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U orchestrator -d ai_orchestrator_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      GO_BPM_TEST_DSN: postgres://orchestrator:testpassword@localhost:5432/ai_orchestrator_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make generate
      - run: git diff --exit-code
      - run: make build
      - run: make vet
      - run: make test
